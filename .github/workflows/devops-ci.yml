name: DevOps CI

on:
  push:
    branches: [main]
    paths:
      - 'compose/**'
      - 'k8s/**'
      - 'observability/**'
      - 'devops/**'
      - '.github/workflows/devops-ci.yml'
  pull_request:
    paths:
      - 'compose/**'
      - 'k8s/**'
      - 'devops/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy env files for compose config
        run: |
          cp compose/.env.dev.example compose/.env.dev
          cp compose/.env.prod.example compose/.env.prod
          sed -i 's/CHANGE_ME/replace_me/g' compose/.env.prod

      - name: Validate compose dev
        working-directory: compose
        run: docker compose -f docker-compose.dev.yml config

      - name: Validate compose dev with apps profile
        working-directory: compose
        run: docker compose -f docker-compose.dev.yml --profile apps config

      - name: Validate compose prod-apps
        working-directory: compose
        run: docker compose -f docker-compose.prod-apps.yml --env-file .env.prod config

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" | tar xz
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate K8s manifests (offline)
        run: kubeconform -summary -ignore-missing-schemas k8s/

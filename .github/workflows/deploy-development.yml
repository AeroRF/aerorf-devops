name: Deploy Development

on:
  workflow_dispatch:
    inputs:
      backend_tag:
        description: Tag da imagem backend no GHCR
        default: latest
        type: string
      frontend_tag:
        description: Tag da imagem frontend no GHCR
        default: latest
        type: string
      target:
        description: Destino do deploy
        default: compose-ssh
        type: choice
        options:
          - compose-ssh
          - kubernetes

permissions:
  contents: read

jobs:
  deploy-compose-ssh:
    if: inputs.target == 'compose-ssh'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Validar secrets
        run: |
          if [[ -z "${{ secrets.DEV_SSH_HOST }}" ]]; then
            echo "::error::Configure DEV_SSH_HOST no environment development"
            exit 1
          fi
          if [[ -z "${{ secrets.DEV_SSH_KEY }}" ]]; then
            echo "::error::Configure DEV_SSH_KEY no environment development"
            exit 1
          fi
          if [[ -z "${{ secrets.GHCR_TOKEN }}" ]]; then
            echo "::warning::GHCR_TOKEN ausente — usando GITHUB_TOKEN (pode falhar em imagens privadas)"
          fi

      - name: Deploy via SSH (Compose + GHCR)
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER || github.actor }}
        run: |
          install -m 600 /dev/stdin ~/.ssh/id_deploy <<EOF
          ${{ secrets.DEV_SSH_KEY }}
          EOF

          USER="${SSH_USER:-root}"
          echo "Conectando em ${USER}@${SSH_HOST}..."

          ssh -i ~/.ssh/id_deploy \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "${USER}@${SSH_HOST}" \
            "export GHCR_TOKEN='${GHCR_TOKEN}'; \
             export GHCR_USER='${GHCR_USER}'; \
             export AERORF_BACKEND_TAG='${{ inputs.backend_tag }}'; \
             export AERORF_FRONTEND_TAG='${{ inputs.frontend_tag }}'; \
             bash -s" < devops/scripts/remote-compose-deploy.sh

      - name: Health check no VPS
        if: success()
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
        run: |
          USER="${SSH_USER:-root}"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "${USER}@${SSH_HOST}" \
            "curl -sf http://127.0.0.1:4000/api/v1/health; echo; curl -sf http://127.0.0.1:3000/api/health; echo"
          echo ""
          echo "Web:  http://${SSH_HOST}:3000"
          echo "API:  http://${SSH_HOST}:4000/api/v1/health"

  deploy-kubernetes:
    if: inputs.target == 'kubernetes'
    runs-on: ubuntu-latest
    environment: development
    env:
      NAMESPACE: aerorf-dev
      REGISTRY: ghcr.io/aerorf
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          if [[ -z "${{ secrets.KUBE_CONFIG }}" ]]; then
            echo "::error::Secret KUBE_CONFIG não configurado no environment development"
            exit 1
          fi
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      - name: Namespace e pull secret GHCR
        run: |
          kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-credentials \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --namespace="${NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests development
        run: kubectl apply -f k8s/aerorf-dev.yaml

      - name: Update images and rollout
        run: |
          kubectl set image deployment/aerorf-api \
            api="${REGISTRY}/aerorf-backend:${{ inputs.backend_tag }}" \
            -n "${NAMESPACE}"
          kubectl set image deployment/aerorf-web \
            web="${REGISTRY}/aerorf-frontend:${{ inputs.frontend_tag }}" \
            -n "${NAMESPACE}"
          kubectl rollout status deployment/aerorf-api -n "${NAMESPACE}" --timeout=180s
          kubectl rollout status deployment/aerorf-web -n "${NAMESPACE}" --timeout=180s
          kubectl get pods,svc -n "${NAMESPACE}"

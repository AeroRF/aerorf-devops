name: Deploy Development

on:
  workflow_dispatch:
    inputs:
      backend_tag:
        description: Tag da imagem backend no GHCR
        default: latest
        type: string
      frontend_tag:
        description: Tag da imagem frontend no GHCR
        default: latest
        type: string
      setup_nginx:
        description: Configurar Nginx (para LiteSpeed na porta 80)
        default: true
        type: boolean
      run_certbot:
        description: Emitir HTTPS Let's Encrypt (DNS deve apontar para a VPS)
        default: false
        type: boolean
      target:
        description: Destino do deploy
        default: compose-ssh
        type: choice
        options:
          - compose-ssh
          - kubernetes
  push:
    branches: [main]
    paths:
      - 'compose/**'
      - 'observability/**'
      - 'devops/**'
      - 'nginx/**'
      - '.github/workflows/deploy-development.yml'

permissions:
  contents: read
  packages: read

jobs:
  deploy-compose-ssh:
    if: github.event_name == 'push' || inputs.target == 'compose-ssh'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Validar secrets
        run: |
          if [[ -z "${{ secrets.DEV_SSH_HOST }}" ]]; then
            echo "::error::Configure DEV_SSH_HOST no environment development"
            exit 1
          fi
          if [[ -z "${{ secrets.DEV_SSH_KEY }}" ]]; then
            echo "::error::Configure DEV_SSH_KEY no environment development"
            exit 1
          fi
          if [[ -z "${{ secrets.GHCR_TOKEN }}" ]]; then
            echo "::warning::GHCR_TOKEN ausente — usando GITHUB_TOKEN (pode falhar em imagens privadas)"
          fi

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_KEY }}
        run: |
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_deploy"
          chmod 600 "${HOME}/.ssh/id_deploy"
          ssh-keygen -y -f "${HOME}/.ssh/id_deploy" >/dev/null

      - name: Pull imagens no runner e transferir para VPS
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          SSH_PORT: ${{ secrets.DEV_SSH_PORT || '22022' }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER || github.actor }}
          BACKEND_TAG: ${{ inputs.backend_tag || 'latest' }}
          FRONTEND_TAG: ${{ inputs.frontend_tag || 'latest' }}
        run: |
          USER="${SSH_USER:-root}"
          BACKEND_IMG="ghcr.io/aerorf/aerorf-backend:${BACKEND_TAG}"
          FRONTEND_IMG="ghcr.io/aerorf/aerorf-frontend:${FRONTEND_TAG}"

          echo "Pull no GitHub Actions (VPS HostGator frequentemente não alcança ghcr.io)..."
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          docker pull "${BACKEND_IMG}"
          docker pull "${FRONTEND_IMG}"

          echo "Empacotando imagens (~pode levar alguns minutos)..."
          docker save "${BACKEND_IMG}" "${FRONTEND_IMG}" | gzip -1 > /tmp/aerorf-apps.tar.gz
          ls -lh /tmp/aerorf-apps.tar.gz

          echo "Enviando para ${USER}@${SSH_HOST}:${SSH_PORT}..."
          scp -i "${HOME}/.ssh/id_deploy" \
            -P "${SSH_PORT}" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=60 \
            -o HostKeyAlgorithms=+ssh-rsa \
            /tmp/aerorf-apps.tar.gz "${USER}@${SSH_HOST}:/tmp/aerorf-apps.tar.gz"

          echo "Carregando imagens no Docker da VPS..."
          ssh -i "${HOME}/.ssh/id_deploy" \
            -p "${SSH_PORT}" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=60 \
            -o ServerAliveInterval=15 \
            -o HostKeyAlgorithms=+ssh-rsa \
            "${USER}@${SSH_HOST}" \
            "gunzip -c /tmp/aerorf-apps.tar.gz | docker load && rm -f /tmp/aerorf-apps.tar.gz"
          rm -f /tmp/aerorf-apps.tar.gz

      - name: Deploy via SSH (Compose)
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          SSH_PORT: ${{ secrets.DEV_SSH_PORT || '22022' }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER || github.actor }}
        run: |
          USER="${SSH_USER:-root}"
          echo "Conectando em ${USER}@${SSH_HOST}:${SSH_PORT}..."

          ssh -i "${HOME}/.ssh/id_deploy" \
            -p "${SSH_PORT}" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            -o HostKeyAlgorithms=+ssh-rsa \
            "${USER}@${SSH_HOST}" \
            "export VPS_HOST='${SSH_HOST}'; \
             export GHCR_TOKEN='${GHCR_TOKEN}'; \
             export GHCR_USER='${GHCR_USER}'; \
             export AERORF_BACKEND_TAG='${{ inputs.backend_tag || 'latest' }}'; \
             export AERORF_FRONTEND_TAG='${{ inputs.frontend_tag || 'latest' }}'; \
             export AERORF_IMAGES_PRELOADED='1'; \
             export AERORF_SETUP_NGINX='${{ inputs.setup_nginx == false && '0' || '1' }}'; \
             export AERORF_CERTBOT='${{ inputs.run_certbot == true && '1' || '0' }}'; \
             export APP_PUBLIC_URL='${{ secrets.APP_PUBLIC_URL }}'; \
             export CORS_ORIGIN='${{ secrets.CORS_ORIGIN }}'; \
             export COOKIE_SECURE='${{ secrets.COOKIE_SECURE }}'; \
             export SLACK_WEBHOOK_URL='${{ secrets.SLACK_WEBHOOK_URL }}'; \
             export GRAFANA_ADMIN_USER='${{ secrets.GRAFANA_ADMIN_USER }}'; \
             export GRAFANA_ADMIN_PASSWORD='${{ secrets.GRAFANA_ADMIN_PASSWORD }}'; \
             export RESEND_API_KEY='${{ secrets.RESEND_API_KEY }}'; \
             export RESEND_FROM_EMAIL='${{ secrets.RESEND_FROM_EMAIL }}'; \
             bash -s" < devops/scripts/remote-compose-deploy.sh

      - name: Notificar Slack — deploy concluído
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          chmod +x devops/scripts/slack-notify.sh
          STATUS="${{ job.status }}"
          HOST="${{ secrets.DEV_SSH_HOST }}"
          BODY=$(cat <<EOF
          Repo: aerorf-devops
          Host: ${HOST}
          Backend: ${{ inputs.backend_tag || 'latest' }}
          Frontend: ${{ inputs.frontend_tag || 'latest' }}
          Commit: ${{ github.sha }}
          Grafana: http://${HOST}:3001
          EOF
          )
          devops/scripts/slack-notify.sh "${STATUS}" "Deploy DevOps (VPS)" "${BODY}"

      - name: Health check no VPS
        if: success()
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          SSH_PORT: ${{ secrets.DEV_SSH_PORT || '22022' }}
        run: |
          USER="${SSH_USER:-root}"
          ssh -i "${HOME}/.ssh/id_deploy" \
            -p "${SSH_PORT}" \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            "${USER}@${SSH_HOST}" \
            "curl -sf http://127.0.0.1:4000/api/v1/health; echo; \
             curl -sf http://127.0.0.1:3000/api/health; echo; \
             curl -sf -H 'Host: aerorf.com.br' http://127.0.0.1/ -o /dev/null -w 'nginx-landing:%{http_code}\n'; \
             curl -sf -H 'Host: app.aerorf.com.br' http://127.0.0.1/login -o /dev/null -w 'nginx-app:%{http_code}\n'; \
             curl -sf http://127.0.0.1:3001/api/health; echo"
          echo ""
          echo "Landing: http://aerorf.com.br  (após DNS + certbot)"
          echo "App:     http://app.aerorf.com.br/login"
          echo "API:     http://api.aerorf.com.br/api/v1/health"
          echo "Grafana: http://${SSH_HOST}:3001  (admin / secret GRAFANA_ADMIN_PASSWORD)"

  deploy-kubernetes:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'kubernetes'
    runs-on: ubuntu-latest
    environment: development
    env:
      NAMESPACE: aerorf-dev
      REGISTRY: ghcr.io/aerorf
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          if [[ -z "${{ secrets.KUBE_CONFIG }}" ]]; then
            echo "::error::Secret KUBE_CONFIG não configurado no environment development"
            exit 1
          fi
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      - name: Namespace e pull secret GHCR
        run: |
          kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-credentials \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --namespace="${NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests development
        run: kubectl apply -f k8s/aerorf-dev.yaml

      - name: Update images and rollout
        run: |
          kubectl set image deployment/aerorf-api \
            api="${REGISTRY}/aerorf-backend:${{ inputs.backend_tag }}" \
            -n "${NAMESPACE}"
          kubectl set image deployment/aerorf-web \
            web="${REGISTRY}/aerorf-frontend:${{ inputs.frontend_tag }}" \
            -n "${NAMESPACE}"
          kubectl rollout status deployment/aerorf-api -n "${NAMESPACE}" --timeout=180s
          kubectl rollout status deployment/aerorf-web -n "${NAMESPACE}" --timeout=180s
          kubectl get pods,svc -n "${NAMESPACE}"

name: Infra CI

on:
  push:
    paths:
      - 'infra/**'
      - '.github/workflows/infra-ci.yml'
  pull_request:
    paths:
      - 'infra/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose dev
        run: docker compose -f infra/compose/docker-compose.dev.yml config
      - name: Validate compose prod-apps
        run: docker compose -f infra/compose/docker-compose.prod-apps.yml config
      - uses: azure/setup-kubectl@v4
      - name: Validate K8s manifests
        run: kubectl apply --dry-run=client -f infra/k8s/

name: Reset Dev Credentials

on:
  workflow_dispatch:
    inputs:
      reset_grafana:
        description: Resetar senha admin do Grafana (grafana-cli)
        default: true
        type: boolean
      reset_platform_admin:
        description: Reenviar convite Resend para admin AeroRF criar nova senha
        default: true
        type: boolean
      admin_email:
        description: E-mail do admin AeroRF
        default: admin@aerorf.com.br
        type: string

permissions:
  contents: read

jobs:
  reset-via-ssh:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Validar secrets
        run: |
          if [[ -z "${{ secrets.DEV_SSH_HOST }}" || -z "${{ secrets.DEV_SSH_KEY }}" ]]; then
            echo "::error::Configure DEV_SSH_HOST e DEV_SSH_KEY"
            exit 1
          fi
          if [[ "${{ inputs.reset_platform_admin }}" == "true" && -z "${{ secrets.DEV_OPS_TOKEN }}" ]]; then
            echo "::error::Configure DEV_OPS_TOKEN no environment development (e redeploy API)"
            exit 1
          fi

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_KEY }}
        run: |
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_deploy"
          chmod 600 "${HOME}/.ssh/id_deploy"

      - name: Reset credenciais na VPS
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          SSH_PORT: ${{ secrets.DEV_SSH_PORT || '22022' }}
        run: |
          USER="${SSH_USER:-root}"
          ssh -i "${HOME}/.ssh/id_deploy" \
            -p "${SSH_PORT}" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -o HostKeyAlgorithms=+ssh-rsa \
            "${USER}@${SSH_HOST}" \
            "export RESET_GRAFANA='${{ inputs.reset_grafana == true && '1' || '0' }}'; \
             export RESET_PLATFORM_ADMIN='${{ inputs.reset_platform_admin == true && '1' || '0' }}'; \
             export DEV_ADMIN_EMAIL='${{ inputs.admin_email }}'; \
             export GRAFANA_ADMIN_PASSWORD='${{ secrets.GRAFANA_ADMIN_PASSWORD }}'; \
             export DEV_OPS_TOKEN='${{ secrets.DEV_OPS_TOKEN }}'; \
             bash -s" < devops/scripts/reset-dev-credentials.sh

      - name: Resumo
        run: |
          echo "Grafana: admin / secret GRAFANA_ADMIN_PASSWORD (ou admin se vazio)"
          echo "AeroRF: convite enviado para ${{ inputs.admin_email }} — use link do e-mail em /ativar-conta"

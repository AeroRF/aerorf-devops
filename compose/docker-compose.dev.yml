# =============================================================================
# AeroRF — Desenvolvimento
# Infra padrão: postgres, redis, minio, observabilidade
# Apps (profile apps): imagens GHCR — ghcr.io/aerorf/aerorf-backend|frontend
#
# Uso:
#   docker compose -f compose/docker-compose.dev.yml up -d
#   docker compose -f compose/docker-compose.dev.yml --profile apps up -d
# =============================================================================

networks:
  aerorf-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: aerorf_postgres
    environment:
      POSTGRES_DB: aerorf
      POSTGRES_USER: aerorf
      POSTGRES_PASSWORD: aerorf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - aerorf-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerorf -d aerorf"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    container_name: aerorf_pgbouncer
    environment:
      DATABASE_URL: postgres://aerorf:aerorf@postgres:5432/aerorf
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    ports:
      - "127.0.0.1:6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aerorf-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # Sem porta no host — evita conflito com Redis do SO (6379); API usa redis:6379 na rede interna
    networks:
      - aerorf-net

  minio:
    image: minio/minio:latest
    container_name: aerorf_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aerorf
      MINIO_ROOT_PASSWORD: aerorf_secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - aerorf-net

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 aerorf aerorf_secret;
      mc mb -p local/aerorf-dev || true;
      mc version enable local/aerorf-dev || true;
      exit 0;
      "
    networks:
      - aerorf-net

  api:
    profiles: ["apps"]
    image: ghcr.io/aerorf/aerorf-backend:${AERORF_BACKEND_TAG:-latest}
    container_name: aerorf_api
    env_file:
      - .env.dev
    environment:
      DATABASE_URL: postgres://aerorf:aerorf@pgbouncer:5432/aerorf
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: aerorf-dev
      S3_ACCESS_KEY: aerorf
      S3_SECRET_KEY: aerorf_secret
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - ../keys/jwt-private.pem:/run/secrets/jwt_private:ro
      - ../keys/jwt-public.pem:/run/secrets/jwt_public:ro
    ports:
      - "4000:4000"
    depends_on:
      - pgbouncer
      - redis
      - minio-init
    networks:
      - aerorf-net

  web:
    profiles: ["apps"]
    image: ghcr.io/aerorf/aerorf-frontend:${AERORF_FRONTEND_TAG:-latest}
    container_name: aerorf_web
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - aerorf-net

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - aerorf-net

  loki:
    image: grafana/loki:2.9.4
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - aerorf-net

  promtail:
    image: grafana/promtail:2.9.4
    volumes:
      - ../observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - aerorf-net

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - aerorf-net

  gateway:
    profiles: ["apps"]
    image: traefik:v2.11
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - aerorf-net

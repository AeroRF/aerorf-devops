# =============================================================================
# AeroRF — Desenvolvimento (VPS via pipeline aerorf-devops)
# Infra padrão: postgres, redis, minio, observabilidade + exporters
# Apps (profile apps): imagens GHCR — ghcr.io/aerorf/aerorf-backend|frontend
#
# Deploy: GitHub Actions deploy-development.yml (sem comandos locais)
# Dados: volumes isolados project-name aerorf-dev — NÃO replicar em homolog/prod
# =============================================================================

networks:
  aerorf-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: aerorf_postgres
    environment:
      POSTGRES_DB: aerorf
      POSTGRES_USER: aerorf
      POSTGRES_PASSWORD: aerorf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - aerorf-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerorf -d aerorf"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    container_name: aerorf_pgbouncer
    environment:
      DATABASE_URL: postgres://aerorf:aerorf@postgres:5432/aerorf
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    ports:
      - "127.0.0.1:6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aerorf-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - aerorf-net

  minio:
    image: minio/minio:latest
    container_name: aerorf_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aerorf
      MINIO_ROOT_PASSWORD: aerorf_secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - aerorf-net

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 aerorf aerorf_secret;
      mc mb -p local/aerorf-dev || true;
      mc version enable local/aerorf-dev || true;
      exit 0;
      "
    networks:
      - aerorf-net

  api:
    profiles: ["apps"]
    image: ghcr.io/aerorf/aerorf-backend:${AERORF_BACKEND_TAG:-latest}
    container_name: aerorf_api
    env_file:
      - .env.dev
    environment:
      DATABASE_URL: postgres://aerorf:aerorf@pgbouncer:5432/aerorf
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: aerorf-dev
      S3_ACCESS_KEY: aerorf
      S3_SECRET_KEY: aerorf_secret
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: "false"
    volumes:
      - ../keys/jwt-private.pem:/run/secrets/jwt_private:ro
      - ../keys/jwt-public.pem:/run/secrets/jwt_public:ro
    ports:
      - "4000:4000"
    depends_on:
      - pgbouncer
      - redis
      - minio-init
    networks:
      - aerorf-net

  web:
    profiles: ["apps"]
    image: ghcr.io/aerorf/aerorf-frontend:${AERORF_FRONTEND_TAG:-latest}
    container_name: aerorf_web
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - aerorf-net

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager
    networks:
      - aerorf-net

  alertmanager:
    image: prom/alertmanager:latest
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$SLACK_WEBHOOK_URL" ]; then
          sed "s|__SLACK_WEBHOOK_URL__|$$SLACK_WEBHOOK_URL|g" /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml
        else
          printf 'global:\n  resolve_timeout: 5m\nroute:\n  receiver: null\nreceivers:\n  - name: null\n' > /tmp/alertmanager.yml
        fi
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    ports:
      - "9093:9093"
    networks:
      - aerorf-net

  node-exporter:
    image: prom/node-exporter:latest
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - aerorf-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgres://aerorf:aerorf@postgres:5432/aerorf?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9187:9187"
    networks:
      - aerorf-net

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis
    ports:
      - "9121:9121"
    networks:
      - aerorf-net

  loki:
    image: grafana/loki:2.9.4
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - aerorf-net

  promtail:
    image: grafana/promtail:2.9.4
    volumes:
      - ../observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - aerorf-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: aerorf_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - prometheus
      - loki
      - alertmanager
    networks:
      - aerorf-net

  gateway:
    profiles: ["apps"]
    image: traefik:v2.11
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - aerorf-net

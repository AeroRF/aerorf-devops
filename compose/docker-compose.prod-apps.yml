# =============================================================================
# AeroRF — Produção/Staging: SOMENTE aplicações stateless
# Postgres, MinIO e Observabilidade são servidores EXTERNOS (env vars)
# Uso: docker compose -f infra/compose/docker-compose.prod-apps.yml --env-file .env.prod up
# =============================================================================

networks:
  aerorf-net:
    driver: bridge

services:
  api:
    image: ghcr.io/aerorf/api:latest
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
    ports:
      - "4000:4000"
    networks:
      - aerorf-net
    restart: unless-stopped

  web:
    image: ghcr.io/aerorf/web:latest
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      API_UPSTREAM: api:4000
      API_INTERNAL_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.aerorf.com.br}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    networks:
      - aerorf-net
    restart: unless-stopped

  gateway:
    image: traefik:v2.11
    command:
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - aerorf-net

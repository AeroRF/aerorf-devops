# Ambiente DEVELOPMENT — aplicar antes do deploy via GitHub Actions ou kubectl local
# Secrets reais: substituir CHANGE_ME ou aplicar via kubectl create secret
apiVersion: v1
kind: Namespace
metadata:
  name: aerorf-dev
---
apiVersion: v1
kind: Secret
metadata:
  name: aerorf-api-secrets
  namespace: aerorf-dev
type: Opaque
stringData:
  DATABASE_URL: postgres://aerorf:aerorf@postgres.aerorf-dev.svc:5432/aerorf
  REDIS_URL: redis://redis.aerorf-dev.svc:6379
  S3_ENDPOINT: http://minio.aerorf-dev.svc:9000
  S3_ACCESS_KEY: aerorf
  S3_SECRET_KEY: aerorf_secret
  JWT_PRIVATE_KEY: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE
    -----END RSA PRIVATE KEY-----
  JWT_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    REPLACE
    -----END PUBLIC KEY-----
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aerorf-api
  namespace: aerorf-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aerorf-api
  template:
    metadata:
      labels:
        app: aerorf-api
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: api
          image: ghcr.io/aerorf/aerorf-backend:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: aerorf-api-secrets
          env:
            - name: NODE_ENV
              value: development
            - name: S3_BUCKET
              value: aerorf-dev
            - name: CORS_ORIGIN
              value: http://localhost:3000
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: aerorf-api
  namespace: aerorf-dev
spec:
  type: NodePort
  selector:
    app: aerorf-api
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30040
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aerorf-web
  namespace: aerorf-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aerorf-web
  template:
    metadata:
      labels:
        app: aerorf-web
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: web
          image: ghcr.io/aerorf/aerorf-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: development
            - name: NEXT_PUBLIC_API_URL
              value: http://localhost:4000/api/v1
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: aerorf-web
  namespace: aerorf-dev
spec:
  type: NodePort
  selector:
    app: aerorf-web
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080

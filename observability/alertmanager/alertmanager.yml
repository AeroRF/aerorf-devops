global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname', 'environment', 'severity']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 30m
  routes:
    - match:
        severity: critical
      receiver: critical
      repeat_interval: 15m

receivers:
  - name: default
    webhook_configs:
      - url: '__ALERT_WEBHOOK_URL__'
        send_resolved: true

  - name: critical
    webhook_configs:
      - url: '__ALERT_WEBHOOK_URL__'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'environment']

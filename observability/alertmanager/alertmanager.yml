global:
  resolve_timeout: 5m

route:
  receiver: slack
  group_by: ['alertname', 'environment', 'severity']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 30m
  routes:
    - match:
        severity: critical
      receiver: slack
      repeat_interval: 15m

receivers:
  - name: slack
    slack_configs:
      - api_url: '__SLACK_WEBHOOK_URL__'
        channel: '#aerorf-alerts'
        username: 'AeroRF Alertmanager'
        icon_emoji: ':rotating_light:'
        title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }} ({{ .GroupLabels.environment }})'
        text: |-
          {{ range .Alerts }}
          *{{ .Labels.severity }}* — {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'environment']

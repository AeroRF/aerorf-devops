server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_name']
        regex: '/aerorf_(api|web|postgres|redis|minio).*'
        target_label: service
        replacement: '$1'
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            event: event
            status: status
            method: method
            path: path
            tenantId: tenantId
            requestId: requestId
      - labels:
          level:
          event:
      - match:
          selector: '{level="error"}'
          stages:
            - static_labels:
                alert_candidate: "true"
      - match:
          selector: '{event="http_error"}'
          stages:
            - static_labels:
                alert_candidate: "true"

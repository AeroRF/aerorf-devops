# AeroRF — reverse proxy (Nginx + Let's Encrypt)
# Copie para /etc/nginx/sites-available/aerorf na VPS.
# Certifique-se de que os containers escutam em 127.0.0.1 conforme abaixo.

# Rate limit básico para API pública
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# --- Landing + SaaS (mesmo container web :3000) ---
server {
    listen 80;
    listen [::]:80;
    server_name aerorf.com.br www.aerorf.com.br app.aerorf.com.br;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- API ---
server {
    listen 80;
    listen [::]:80;
    server_name api.aerorf.com.br;

    location / {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }
}

# --- Grafana (restringir por IP ou basic auth em produção) ---
server {
    listen 80;
    listen [::]:80;
    server_name grafana.aerorf.com.br;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- MinIO S3 API ---
server {
    listen 80;
    listen [::]:80;
    server_name storage.aerorf.com.br;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
    }
}

# --- MinIO Console ---
server {
    listen 80;
    listen [::]:80;
    server_name console.storage.aerorf.com.br;

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Prometheus (opcional; preferir VPN) ---
server {
    listen 80;
    listen [::]:80;
    server_name prometheus.aerorf.com.br;

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
    }
}

# Após certbot, blocos listen 443 ssl serão adicionados automaticamente.
# Exemplo manual:
# ssl_certificate /etc/letsencrypt/live/aerorf.com.br/fullchain.pem;
# ssl_certificate_key /etc/letsencrypt/live/aerorf.com.br/privkey.pem;
